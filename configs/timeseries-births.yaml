# Example: daily single-series forecasting (female births).
#
# Real dataset: daily total female births in California, 1959
# (https://github.com/jbrownlee/Datasets, 365 rows). Daily frequency, so the
# default lag/rolling shapes apply: lag 1/7/14 (yesterday, same weekday last
# week, two weeks ago) and 7/14-day rolling means capture the weekly cycle.
# Vendored fallback lives at data/daily-female-births.csv — point `path` at
# it to run offline.
task: timeseries

data:
  source: file
  path: https://raw.githubusercontent.com/jbrownlee/Datasets/master/daily-total-female-births.csv
  format: csv
  target_column: Births
  date_column: Date
  n_lags: [1, 7, 14]
  rolling_windows: [7, 14]
  test_size: 0.2              # fraction of (post-warm-up) rows held out, chronologically

features:
  scale_numeric: true
  # Demo of the engineering.py options: cyclical month/day-of-week encoding
  # plus US holidays (1959-07-04 falls inside this series).
  cyclical_encoding: true
  holiday_country: "US"

model:
  type: random_forest        # any REGRESSOR_REGISTRY entry
  params:
    n_estimators: 300
    random_state: 42

eda:
  enabled: true
  output_dir: artifacts/births/plots

artifacts:
  model_path: artifacts/births/model.joblib
  metrics_path: artifacts/births/metrics.json
  plots_dir: artifacts/births/plots

output:
  format: null   # "csv" | "parquet" | null to infer from --output's extension
