# Example 3: single-series forecasting.
#
# Real dataset: the classic Box-Jenkins Airline Passengers series (monthly
# totals, 1949-1960) — also published on Kaggle as
# https://www.kaggle.com/datasets/rakannimer/air-passengers. Small (144
# rows) and clean, so lags/rolling windows below are tuned for monthly
# (not daily) seasonality: lag 1 (previous month) and lag 12 (same month
# last year) tend to matter most.
task: timeseries

data:
  source: file
  path: https://raw.githubusercontent.com/jbrownlee/Datasets/master/airline-passengers.csv
  format: csv
  target_column: Passengers
  date_column: Month
  n_lags: [1, 12]
  rolling_windows: [3, 12]
  test_size: 0.2              # fraction of (post-warm-up) rows held out, chronologically

features:
  scale_numeric: true

model:
  type: random_forest        # any REGRESSOR_REGISTRY entry
  params:
    n_estimators: 300
    random_state: 42

eda:
  enabled: true
  output_dir: artifacts/timeseries/plots

artifacts:
  model_path: artifacts/timeseries/model.joblib
  metrics_path: artifacts/timeseries/metrics.json
  plots_dir: artifacts/timeseries/plots

output:
  format: null   # "csv" | "parquet" | null to infer from --output's extension
