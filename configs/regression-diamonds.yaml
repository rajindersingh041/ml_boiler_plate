# Example: large tabular regression on Diamonds.
#
# Real dataset: ggplot2 diamonds (seaborn-data mirror, ~54k rows). Target is
# price; cut/color/clarity are ordered categoricals treated here as plain
# categoricals. Uses hist_gradient_boosting — the right default at this row
# count (plain gradient_boosting would be much slower).
# Vendored fallback lives at data/diamonds.csv — point `path` at it to run offline.
task: regression

data:
  source: file
  path: https://raw.githubusercontent.com/mwaskom/seaborn-data/master/diamonds.csv
  format: csv
  target_column: price
  test_size: 0.2
  random_state: 42

features:
  numeric_columns: [carat, depth, table, x, y, z]
  categorical_columns: [cut, color, clarity]
  scale_numeric: false      # tree model: scaling buys nothing, skip the cost
  missing_strategy_numeric: median

model:
  type: hist_gradient_boosting   # linear_regression | ridge | random_forest |
                                # gradient_boosting | hist_gradient_boosting | bagging
  params:
    random_state: 42

eda:
  enabled: true
  output_dir: artifacts/diamonds/plots

artifacts:
  model_path: artifacts/diamonds/model.joblib
  metrics_path: artifacts/diamonds/metrics.json
  plots_dir: artifacts/diamonds/plots

output:
  format: null   # "csv" | "parquet" | null to infer from --output's extension
