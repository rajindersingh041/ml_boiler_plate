# Example 1: binary classification (e.g. churn, fraud, spam).
task: classification

data:
  source: synthetic        # "synthetic" | "file"
  # path: data/train.csv   # local path or http(s) URL, when source: file
  # format: csv             # "csv" | "parquet" | omit to infer from extension
  target_column: target
  test_size: 0.2
  random_state: 42

features:
  scale_numeric: true
  missing_strategy_numeric: median
  missing_strategy_categorical: most_frequent

model:
  type: random_forest      # logistic_regression | random_forest | gradient_boosting |
                            # hist_gradient_boosting | bagging
  params:
    n_estimators: 200
    random_state: 42

eda:
  enabled: true
  output_dir: artifacts/classification/plots

artifacts:
  model_path: artifacts/classification/model.joblib
  metrics_path: artifacts/classification/metrics.json
  plots_dir: artifacts/classification/plots

output:
  format: null   # "csv" | "parquet" | null to infer from --output's extension
