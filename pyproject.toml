[project]
name = "ml-boilerplate"
version = "0.1.0"
description = "Generic boilerplate for supervised ML learning tasks: classification, regression, and time-series forecasting (data -> EDA -> features -> train -> evaluate -> predict), with charts and flexible I/O."
readme = "README.md"
authors = [
    { name = "Rajinder Singh", email = "rajinder.singh@zooplus.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "plotly>=5.20",
    "pyarrow>=15",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ml-boilerplate = "ml_boilerplate.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
